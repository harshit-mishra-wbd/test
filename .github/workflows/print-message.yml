name: Print Message

on:
  workflow_dispatch: {}

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Not on main branch"
            exit 1
          fi
          echo "::warning::These changes are not deployed yet and will ship with this run: .github/workflows/print-message.yml"
          echo "### Not deployed yet" >> "$GITHUB_STEP_SUMMARY"
          echo ".github/workflows/print-message.yml" >> "$GITHUB_STEP_SUMMARY"

  print:
    needs: check-branch
    runs-on: ubuntu-latest
    environment:
      name: stage
    steps:
      - name: Print a message
        run: echo "Hello from GitHub Actions!"
