name: Print Message

on:
  workflow_dispatch: {}

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Not on main branch"
            exit 1
          fi

  print:
    needs: check-branch
    runs-on: ubuntu-latest
    environment:
      name: stage
    steps:
      - name: Print a message
        run: echo "Hello from GitHub Actions!"
