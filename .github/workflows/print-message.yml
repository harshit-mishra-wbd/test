name: Print Message

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        type: choice
        required: true
        default: 'main'
        options:
          - 'main'

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Print a message
        run: echo "Hello from GitHub Actions!"
